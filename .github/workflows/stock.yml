name: iphone-stock-check

on:
  workflow_dispatch:         # manual only: Apple blocks GitHub IPs, the checker runs on a PC instead

permissions:
  contents: write            # needed to commit state.json

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chrome
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chrome

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEADED: "1"
        run: xvfb-run -a python check.py

      - name: Persist state
        run: |
          if ! git diff --quiet state.json; then
            # Only commit when availability/health changed, not for timestamps alone
            git config user.name  "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state update [skip ci]"
            git pull --rebase -q || true
            git push
          fi
